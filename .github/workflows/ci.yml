on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Continuous integration

permissions:
  contents: read

env:
  PROTOC_VERSION: "3.25.3"

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [beta, stable, 1.82.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7 (pinned; bump ref+sha together)
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # dtolnay/rust-toolchain@master (pinned; bump ref+sha together)
        with:
          toolchain: ${{ matrix.rust }}
      # Skip cargo update for MSRV validation build
      - run: cargo update
        if: ${{ matrix.rust == 'stable' || matrix.rust == 'beta' }}
      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@5ef766c8ab411a29af509ca0b98737809e47b092  # lukka/get-cmake@latest (pinned; bump ref+sha together)
      - name: install protoc
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # taiki-e/install-action@v2 (pinned; bump ref+sha together)
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - run: cargo test --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7 (pinned; bump ref+sha together)
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # dtolnay/rust-toolchain@master (pinned; bump ref+sha together)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@5ef766c8ab411a29af509ca0b98737809e47b092  # lukka/get-cmake@latest (pinned; bump ref+sha together)
      - name: install protoc
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # taiki-e/install-action@v2 (pinned; bump ref+sha together)
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all -- -D warnings
      - run: cargo check
      - run: cargo check --package prost-reflect --no-default-features
      - run: cargo check --package prost-reflect --no-default-features --features=text-format
      - run: cargo check --package prost-reflect --no-default-features --features=serde
      - run: cargo check --package prost-reflect --all-features
      - name: Check README.md is up-to-date
        shell: pwsh
        run: |
          ./generate-readme.ps1
          if (git diff README.md) {
            Write-Error "README.md is out-of-date, run generate-readme.ps1 to regenerate it." -ErrorAction Stop
          }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7 (pinned; bump ref+sha together)
        with:
          submodules: recursive
          persist-credentials: false
      - name: install protoc
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # taiki-e/install-action@v2 (pinned; bump ref+sha together)
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: Generate code coverage
        run: |
          cargo tarpaulin --verbose --packages prost-reflect prost-reflect-tests --all-features --timeout 120 --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # codecov/codecov-action@v4 (pinned; bump ref+sha together)
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
